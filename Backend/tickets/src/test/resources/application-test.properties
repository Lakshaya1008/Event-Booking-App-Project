# Test profile ? uses H2 in-memory database instead of PostgreSQL
# Used by @DataJpaTest repository tests

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Use standard H2 dialect for tests (not the custom PostgreSQLEnumDialect)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Email config for tests
app.brevo.api-key=test_brevo_key
app.mail.enabled=false

