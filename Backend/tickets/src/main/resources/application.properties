spring.application.name=tickets

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/Event_Booking_App_db
spring.datasource.username=postgres
# L-22 FIX: use environment variable ? never hardcode credentials in source control
# REMOVED DEFAULT VALUE - must be set via environment variable or startup will fail
spring.datasource.password=${DB_PASSWORD}

# ===============================
# HikariCP Connection Pool
# ===============================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
# L-23 FIX: show-sql=false ? SQL logging to stdout in production leaks query structure,
# floods logs with noise, and has measurable performance overhead.
# Enable locally by setting spring.jpa.show-sql=true in application-dev.properties
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=com.event.tickets.config.PostgreSQLEnumDialect
spring.jpa.properties.hibernate.hbm2ddl.jdbc_metadata_extraction_strategy=individually

# ===============================
# Server
# ===============================
server.port=8081

# ===============================
# Pagination Safety
# Prevents ?size=999999 from dumping entire database
# ===============================
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.default-page-size=20

# ===============================
# Keycloak Configuration
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/event-ticket-platform
keycloak.admin.server-url=${KEYCLOAK_SERVER_URL:http://localhost:9090}
keycloak.admin.realm=${KEYCLOAK_REALM:event-ticket-platform}
keycloak.admin.client-id=${KEYCLOAK_CLIENT_ID:event-ticket-platform-app}
keycloak.admin.client-secret=${KEYCLOAK_CLIENT_SECRET:admin}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# ===============================
# Email ? Brevo Transactional API
# No SMTP ports needed. Works on Render free tier.
# Sign up free at brevo.com (300 emails/day)
# Set BREVO_API_KEY as environment variable on your server
# ===============================
app.brevo.api-key=${BREVO_API_KEY:your_brevo_api_key_here}
app.mail.from-email=${MAIL_FROM_EMAIL:noreply@eventbooking.com}
app.mail.from-name=${MAIL_FROM_NAME:Event Booking Platform}
app.mail.enabled=${MAIL_ENABLED:true}

# ===============================
# Swagger / OpenAPI
# Visit: http://localhost:8081/swagger-ui.html
# ===============================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# FIX #12: Enable metrics tagging for better observability
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=production

# ===============================
# FIX #13-1: Resilience4j Retry Configuration
# Handles transient Keycloak failures (restarts, temporary network issues)
# ===============================
resilience4j.retry.instances.keycloak.max-attempts=3
resilience4j.retry.instances.keycloak.wait-duration=1000
resilience4j.retry.instances.keycloak.retry-exceptions=java.net.ConnectException,java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException
